# zentv CI: lint, tests and a secret scan. Every action is pinned by commit SHA (ground rule 11,
# SECURITY_AUDIT.md CT-12). No secrets are used and the token is read-only.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - name: Install (locked, hashes checked)
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (fake TV only; no device)
        run: uv run pytest -q

  launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify the Gradle wrapper jar (official 9.9.2 checksum)
        run: echo "621008afc4f5d59357fcf06ffa644dd5aade5e091bdc363742710445f73cdaf8  launcher/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Build, unit tests and lint (dependency verification on, no private logos)
        working-directory: launcher
        run: >-
          ./gradlew --no-daemon -Pzentv.localIcons=false
          assembleCoreRelease assembleWeatherRelease
          testCoreDebugUnitTest testWeatherDebugUnitTest lintCoreRelease lintWeatherRelease
      - name: "APK rules: core has no permissions, weather only INTERNET, no native code, no logos, core < 3 MB"
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          CORE=launcher/app/build/outputs/apk/core/release/app-core-release-unsigned.apk
          WX=launcher/app/build/outputs/apk/weather/release/app-weather-release-unsigned.apk
          core_perms=$("$AAPT2" dump permissions "$CORE" | grep uses-permission || true)
          wx_perms=$("$AAPT2" dump permissions "$WX" | grep uses-permission | sed "s/.*name='\([^']*\)'.*/\1/" | sort -u | tr '\n' ' ')
          echo "core permissions: [${core_perms}]"
          echo "weather permissions: [${wx_perms}]"
          test -z "$core_perms"
          test "$wx_perms" = "android.permission.INTERNET "
          for apk in "$CORE" "$WX"; do
            test "$(unzip -l "$apk" | grep -c '\.so$' || true)" = 0
            test "$(unzip -l "$apk" | grep -c 'assets/consoles/' || true)" = 0
          done
          size=$(stat -c %s "$CORE"); echo "core size: $size bytes"
          test "$size" -lt 3145728

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (release binary, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --no-banner
